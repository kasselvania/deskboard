worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null emerg;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host deskboard-api;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Authorization "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_intercept_errors on;

        error_page 413 = @body_too_large;
        error_page 502 503 504 = @api_unavailable;

        location = /health {
            if ($request_method != GET) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            proxy_pass http://api:3001;
        }

        location = /v1/board {
            if ($request_method != GET) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            proxy_pass http://api:3001;
        }

        location = /v1/apple-source-snapshots {
            if ($request_method != POST) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            client_max_body_size 1024k;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://api:3001;
        }

        location = /v1/apple-bridge-status {
            if ($request_method != POST) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            client_max_body_size 256k;
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://api:3001;
        }

        location = /board {
            if ($request_method != GET) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
        }

        location = /manifest.webmanifest {
            if ($request_method != GET) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /deskboard-icon.svg {
            if ($request_method != GET) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location = /apple-touch-icon.png {
            if ($request_method != GET) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location ^~ /assets/ {
            if ($request_method != GET) {
                return 405 '{"error":{"code":"PRIVATE_PROXY_METHOD_NOT_ALLOWED","message":"The request method is not allowed."}}';
            }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        location @body_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"PRIVATE_PROXY_BODY_TOO_LARGE","message":"The request body is too large."}}';
        }

        location @api_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"PRIVATE_PROXY_UNAVAILABLE","message":"The private service is unavailable."}}';
        }

        location / {
            default_type application/json;
            return 404 '{"error":{"code":"PRIVATE_PROXY_ROUTE_NOT_FOUND","message":"The requested route does not exist."}}';
        }
    }
}
